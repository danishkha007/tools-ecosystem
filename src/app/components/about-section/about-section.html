<div class="about-section">
    <div class="about-left">
            <span class="hero-badge" *ngIf="aboutSection.badgeText">
                <!-- <svg *ngIf="aboutSection.badgeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> -->
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#3c8cff"><path d="M440-280h80v-240h-80v240Zm68.5-331.5Q520-623 520-640t-11.5-28.5Q497-680 480-680t-28.5 11.5Q440-657 440-640t11.5 28.5Q463-600 480-600t28.5-11.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
                {{ aboutSection.badgeText }}
            </span>
            <h2 *ngIf="aboutSection.title">{{ aboutSection.title }}</h2>
            <p *ngIf="aboutSection.description">{{ aboutSection.description }}</p>
            <div class="about-features" *ngIf="aboutSection.features">
                <div *ngFor="let feature of aboutSection.features; let i = index" class="grid-item" [class]="'item-' + (i + 1)">
                    <div class="item-header">
                        <img src="verified.png" alt="Verified Icon">
                        <h3>{{ feature.title }}</h3>
                    </div>
                    <p>{{ feature.description }}</p>
                </div>
            </div>
    </div>
    <div class="about-right">
        <img src="{{aboutSection.visualContent.src}}" alt="aboutSection.visualContent.alt">
    </div>
</div>
