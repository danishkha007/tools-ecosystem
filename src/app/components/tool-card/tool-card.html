<article
  class="card"
  role="button"
  tabindex="0"
  (click)="navigate()"
  (keydown.enter)="navigate()"
  (keydown.space)="navigate(); $event.preventDefault()"
>
  <span class="badge back"></span>
  <span class="badge">{{ categoryName || tool.category }}</span>
  <div class="card-header" *ngIf="tool.icon">
    <div class="icon">
      <img [src]="tool.icon" [alt]="tool.iconAlt || tool.name" />
    </div>
  </div>

  <h2 class="tool-name">{{ tool.name }}</h2>

  <p class="description">
    {{ tool.longDescription || tool.shortDescription }}
  </p>

  <div class="card-footer">
    <span class="button">
      {{ tool.buttonText }}
      <span aria-hidden="true">→</span>
    </span>
  </div>
</article>
