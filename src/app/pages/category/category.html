<app-breadcrumbs></app-breadcrumbs>
<main class="category-page">
  <section class="category-header">
    <div class="category-heading">
      <div>
        <p class="eyebrow">Tool Category</p>
        <h1>{{ category.name }}</h1>
        <p>Browse every available tool in this category.</p>
      </div>
      <span class="tool-count">{{ category.tools?.length }} tools</span>
    </div>
  </section>

  @if (category.tools?.length) {
    <section class="tools-grid" [attr.aria-label]="category.name + ' tools'">
      @for (tool of category.tools; track tool.id) {
        <app-tool-card [tool]="tool" [categoryName]="getCategoryName(tool)"></app-tool-card>
      }
    </section>
  } @else {
    <section class="empty-state">
      <h2>No tools found</h2>
      <p>This category does not have any tools yet.</p>
      <a routerLink="/">Browse all tools</a>
    </section>
  }
</main>
