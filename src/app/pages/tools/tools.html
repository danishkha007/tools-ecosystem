  <div class="page-ctn">

      <section id="available-tools" class="tools-section">
          <!-- Hero Banner -->
          <div class="tools-hero">
              <div class="hero-content">
                  <div class="hero-badge">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                          <path d="M14 2H6C4.89 2 4 2.89 4 4V20C4 21.11 4.89 22 6 22H18C19.11 22 20 21.11 20 20V8L14 2Z" stroke="currentColor" stroke-width="2"/>
                          <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Available Now</span>
                    </div>
                    <h2 class="hero-title">Explore Our Tools</h2>
                    <p class="hero-subtitle">Powerful, free, browser-based tools to boost your productivity</p>
                </div>
                <div class="hero-visual">
                    <div class="floating-icons">
                        <div class="icon-box icon-1">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M14 2H6C4.89 2 4 2.89 4 4V20C4 21.11 4.89 22 6 22H18C19.11 22 20 21.11 20 20V8L14 2Z"/>
                                <polyline points="14 2 14 8 20 8"/>
                            </svg>
                        </div>
                        <div class="icon-box icon-2">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                            </svg>
                        </div>
                        <div class="icon-box icon-3">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Filters Row -->
            <div class="filters-row">
                <div class="category-filters">
                    <button 
                    class="filter-btn" 
                    [class.active]="selectedCategory === null"
                    (click)="selectCategory(null)">
                    <span class="btn-text">All</span>
                    <span class="btn-count">{{ allTools.length }}</span>
                </button>
                <button 
                *ngFor="let category of categoriesWithTools" 
                class="filter-btn"
                [class.active]="isCategorySelected(category.id)"
                (click)="selectCategory(category.id)">
                <span class="btn-text">{{ category.name }}</span>
                <span class="btn-count">{{ category.tools?.length || 0 }}</span>
            </button>
        </div>
        <div class="sort-control">
            <label>Sort:</label>
            <select [(ngModel)]="sortOption" (ngModelChange)="onSortChange()">
                <option *ngFor="let opt of sortOptions" [value]="opt.value">{{ opt.label }}</option>
            </select>
        </div>
    </div>
    
    <!-- Filtered Tools Grid -->
    <div class="tools-all-grid">
        <app-tool-card
        *ngFor="let tool of filteredTools; let i = index"
        [tool]="tool"
        [categoryName]="getCategoryName(tool)">
    </app-tool-card>
</div>
</section>
</div>
